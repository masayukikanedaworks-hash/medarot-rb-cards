<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通り芯照合ツール</title>
<style>
  :root {
    --border: #d7dde3;
    --ink: #24313d;
    --sub: #5c6b78;
    --accent: #1565d8;
    --bg: #f2f5f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.6;
  }
  header {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .ver { color: var(--sub); font-size: 12px; }
  header .privacy { color: var(--sub); font-size: 12px; margin-left: auto; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px 20px 60px; }
  .panels { display: flex; gap: 16px; flex-wrap: wrap; }
  .panel {
    flex: 1 1 480px;
    min-width: 420px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px 16px;
  }
  .panel h2, #check h2 { font-size: 15px; margin: 0 0 10px; }
  .file-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .file-btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .file-btn:hover { filter: brightness(1.08); }
  .fname { color: var(--sub); font-size: 12px; word-break: break-all; }
  .ctrl-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; font-size: 13px; }
  .ctrl-row input[type="number"] { width: 70px; padding: 2px 4px; }
  .scale-note { color: var(--sub); font-size: 12px; }
  .status { min-height: 20px; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .status.error { color: #b30021; }
  canvas.preview {
    width: 100%;
    height: 380px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    display: block;
  }
  .axis-list { max-height: 260px; overflow: auto; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; background: #fff; }
  th, td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; white-space: nowrap; }
  th { background: #eef2f5; font-weight: 600; position: sticky; top: 0; }
  table.axes tr.off td { color: #a7b0b8; }
  #check {
    margin-top: 16px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px 16px;
  }
  .check-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; font-size: 13px; }
  .check-row label { user-select: none; }
  #tol { width: 60px; padding: 2px 4px; }
  #run-check {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 22px;
    font-size: 14px;
    cursor: pointer;
  }
  #run-check:disabled { background: #b9c4ce; cursor: not-allowed; }
  #csv-dl {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    margin-left: 10px;
  }
  .summary { font-weight: 600; margin: 12px 0 8px; }
  .summary.ng { color: #b30021; }
  .summary.warn { color: #9a6b00; }
  .summary.ok { color: #0a7a3d; }
  table.result td.st { font-weight: 700; text-align: center; }
  table.result tr.ng { background: #fdebee; }
  table.result tr.ng td.st { color: #b30021; }
  table.result tr.warn { background: #fdf6e3; }
  table.result tr.warn td.st { color: #9a6b00; }
  table.result tr.ok td.st { color: #0a7a3d; }
  #result { overflow: auto; }
  footer { color: var(--sub); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <h1>通り芯照合ツール</h1>
  <span class="ver"></span>
  <span class="privacy">図面はブラウザ内でのみ処理され、外部には送信されません</span>
</header>
<main>
  <div class="panels">
    <section class="panel">
      <h2>1. 基準図面</h2>
      <div id="panel-base-body"></div>
    </section>
    <section class="panel">
      <h2>2. 比較図面</h2>
      <div id="panel-cmp-body"></div>
    </section>
  </div>
  <section id="check">
    <h2>3. チェック項目を選んで照合</h2>
    <div class="check-row">
      <label><input type="checkbox" id="ck-labels" checked> 通り芯符号の対応</label>
      <label><input type="checkbox" id="ck-spacing" checked> 芯々寸法</label>
      <label><input type="checkbox" id="ck-total" checked> 全体寸法</label>
      <label><input type="checkbox" id="ck-dims"> 寸法注記と作図位置の整合（各図面内）</label>
      <label>許容差 ± <input type="number" id="tol" value="1" min="0" step="0.5"> mm</label>
    </div>
    <button id="run-check" disabled>照合する</button>
    <button id="csv-dl" hidden>CSVダウンロード</button>
    <div id="result"></div>
  </section>
  <footer>
    <p>ベクターPDF専用（スキャンPDFは読み取れません）。検出されなかった箇所に差異が無いことを保証するものではありません。最終確認は必ず図面で行ってください。</p>
  </footer>
</main>
<script>
/* ===== 00_ns.js ===== */
// 通り芯照合ツール 名前空間
// 各ファイルは _order.json の順に連結される前提。import/export は使わない。
(function (g) {
  "use strict";
  g.ZC = g.ZC || {};
  g.ZC.VERSION = "1.0.0";
})(globalThis);

/* ===== 01_util.js ===== */
// 汎用ユーティリティ（文字正規化・行列・数値）
(function (ZC) {
  "use strict";

  // 全角英数記号→半角に寄せ、空白を除去して大文字化する（通り芯符号の比較用）
  function normalizeLabel(s) {
    let out = "";
    for (const ch of String(s)) {
      const c = ch.codePointAt(0);
      if (c === 0x3000 || c === 0x20 || c === 9 || c === 10 || c === 13) continue;
      if (c >= 0xff01 && c <= 0xff5e) {
        out += String.fromCharCode(c - 0xfee0);
        continue;
      }
      out += ch;
    }
    return out.toUpperCase();
  }

  // 寸法値らしい文字列を mm 数値へ（"6,000" → 6000）。該当しなければ null
  function parseDimNumber(s) {
    const t = normalizeLabel(s).replace(/,/g, "");
    if (!/^\d{3,5}$/.test(t)) return null;
    const v = Number(t);
    return v >= 100 && v <= 99999 ? v : null;
  }

  // 通り芯符号らしい文字列か（X1 / Y10 / A / 3 など。3桁以上の純数字は寸法値とみなし除外）
  function isAxisLabel(norm) {
    if (!norm || norm.length > 4) return false;
    if (/^[0-9]{1,2}$/.test(norm)) return true;
    return /^[A-Z]{1,2}[0-9]{0,3}$/.test(norm);
  }

  function median(arr) {
    if (!arr.length) return NaN;
    const a = arr.slice().sort((x, y) => x - y);
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  // PDF の行ベクトル規約 [a b c d e f]: p' = p・M
  const MAT = {
    id() {
      return [1, 0, 0, 1, 0, 0];
    },
    translate(tx, ty) {
      return [1, 0, 0, 1, tx, ty];
    },
    mul(a, b) {
      // a を先に適用してから b（p・a・b）
      return [
        a[0] * b[0] + a[1] * b[2],
        a[0] * b[1] + a[1] * b[3],
        a[2] * b[0] + a[3] * b[2],
        a[2] * b[1] + a[3] * b[3],
        a[4] * b[0] + a[5] * b[2] + b[4],
        a[4] * b[1] + a[5] * b[3] + b[5],
      ];
    },
    apply(m, x, y) {
      return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
    },
    // 等方近似の拡大率（線幅・文字サイズのデバイス換算に使う）
    scaleOf(m) {
      const det = Math.abs(m[0] * m[3] - m[1] * m[2]);
      return det > 0 ? Math.sqrt(det) : Math.hypot(m[0], m[1]);
    },
  };

  function latin1(bytes, start, end) {
    start = start || 0;
    if (end === undefined) end = bytes.length;
    let s = "";
    const CHUNK = 8192;
    for (let i = start; i < end; i += CHUNK) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(end, i + CHUNK)));
    }
    return s;
  }

  // バイト列から ASCII 文字列を探す（見つからなければ -1）
  function indexOfBytes(hay, needleStr, from) {
    const n = needleStr.length;
    const first = needleStr.charCodeAt(0);
    outer: for (let i = Math.max(0, from | 0); i <= hay.length - n; i++) {
      if (hay[i] !== first) continue;
      for (let j = 1; j < n; j++) {
        if (hay[i + j] !== needleStr.charCodeAt(j)) continue outer;
      }
      return i;
    }
    return -1;
  }

  function fmtMm(v, digits) {
    if (v == null || !isFinite(v)) return "—";
    return v.toFixed(digits === undefined ? 1 : digits);
  }

  ZC.util = { normalizeLabel, parseDimNumber, isAxisLabel, median, MAT, latin1, indexOfBytes, fmtMm };
})(globalThis.ZC = globalThis.ZC || {});

/* ===== 10_filters.js ===== */
// PDF ストリームフィルタ（FlateDecode ほか）
// FlateDecode はブラウザ/Node 標準の DecompressionStream を使い、外部依存を持たない。
(function (ZC) {
  "use strict";

  function pump(format, bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
    return new Response(stream).arrayBuffer().then((b) => new Uint8Array(b));
  }

  function trimTrailingWs(bytes) {
    let end = bytes.length;
    while (end > 0 && [0, 9, 10, 12, 13, 32].includes(bytes[end - 1])) end--;
    return bytes.subarray(0, end);
  }

  async function inflate(bytes) {
    // zlib 形式 → 末尾ゴミ除去 → 生 deflate の順で試す（壊れ気味の PDF 対策）
    const attempts = [
      ["deflate", bytes],
      ["deflate", trimTrailingWs(bytes)],
      ["deflate-raw", bytes.length > 2 && (bytes[0] & 0x0f) === 8 ? bytes.subarray(2) : bytes],
    ];
    let lastErr = null;
    for (const [fmt, b] of attempts) {
      try {
        return await pump(fmt, b);
      } catch (e) {
        lastErr = e;
      }
    }
    throw new Error("FlateDecodeに失敗しました: " + (lastErr && lastErr.message));
  }

  // PNG/TIFF Predictor（主に xref ストリームで使われる）
  function applyPredictor(data, parms) {
    const pred = num(parms.Predictor, 1);
    if (pred <= 1) return data;
    const colors = num(parms.Colors, 1);
    const bpc = num(parms.BitsPerComponent, 8);
    const cols = num(parms.Columns, 1);
    const bpp = Math.max(1, Math.ceil((colors * bpc) / 8));
    const rowLen = Math.ceil((colors * bpc * cols) / 8);
    if (pred === 2) {
      // TIFF: bpc=8 のみ対応
      if (bpc !== 8) return data;
      const out = data.slice();
      for (let r = 0; r + rowLen <= out.length; r += rowLen) {
        for (let i = bpp; i < rowLen; i++) out[r + i] = (out[r + i] + out[r + i - bpp]) & 0xff;
      }
      return out;
    }
    // PNG系: 各行の先頭 1 バイトがフィルタ種別
    const rows = Math.floor(data.length / (rowLen + 1));
    const out = new Uint8Array(rows * rowLen);
    let prev = new Uint8Array(rowLen);
    for (let r = 0; r < rows; r++) {
      const ft = data[r * (rowLen + 1)];
      const src = data.subarray(r * (rowLen + 1) + 1, (r + 1) * (rowLen + 1));
      const cur = out.subarray(r * rowLen, (r + 1) * rowLen);
      for (let i = 0; i < rowLen; i++) {
        const raw = src[i];
        const a = i >= bpp ? cur[i - bpp] : 0;
        const b = prev[i];
        const c = i >= bpp ? prev[i - bpp] : 0;
        let v;
        switch (ft) {
          case 0: v = raw; break;
          case 1: v = raw + a; break;
          case 2: v = raw + b; break;
          case 3: v = raw + ((a + b) >> 1); break;
          case 4: {
            const p = a + b - c;
            const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
            v = raw + (pa <= pb && pa <= pc ? a : pb <= pc ? b : c);
            break;
          }
          default: v = raw;
        }
        cur[i] = v & 0xff;
      }
      prev = cur;
    }
    return out;
  }

  function asciiHexDecode(bytes) {
    const out = [];
    let hi = -1;
    for (let i = 0; i < bytes.length; i++) {
      const c = bytes[i];
      if (c === 0x3e) break; // >
      const d = hexVal(c);
      if (d < 0) continue;
      if (hi < 0) hi = d;
      else {
        out.push(hi * 16 + d);
        hi = -1;
      }
    }
    if (hi >= 0) out.push(hi * 16);
    return new Uint8Array(out);
  }

  function ascii85Decode(bytes) {
    const out = [];
    let tuple = 0, count = 0;
    let i = 0;
    // 先頭の <~ を読み飛ばす
    if (bytes[0] === 0x3c && bytes[1] === 0x7e) i = 2;
    for (; i < bytes.length; i++) {
      const c = bytes[i];
      if (c === 0x7e) break; // ~>
      if ([0, 9, 10, 12, 13, 32].includes(c)) continue;
      if (c === 0x7a && count === 0) { // z = 0x00000000
        out.push(0, 0, 0, 0);

      if (c < 0x21 || c > 0x75) continue;
      tuple = tuple * 85 + (c - 0x21);
      if (++count === 5) {
        out.push((tuple >>> 24) & 0xff, (tuple >>> 16) & 0xff, (tuple >>> 8) & 0xff, tuple & 0xff);
        tuple = 0;
        count = 0;
      }
    }
    if (count > 0) {
      for (let j = count; j < 5; j++) tuple = tuple * 85 + 84;
      const b = [(tuple >>> 24) & 0xff, (tuple >>> 16) & 0xff, (tuple >>> 8) & 0xff, tuple & 0xff];
      for (let j = 0; j < count - 1; j++) out.push(b[j]);

  }

  function runLengthDecode(bytes) {
    const out = [];
    let i = 0;
    while (i < bytes.length) {
      const l = bytes[i++];
      if (l === 128) break;
      if (l < 128) {
        for (let j = 0; j <= l; j++) out.push(bytes[i++]);
      } else {
        const b = bytes[i++];
        for (let j = 0; j < 257 - l; j++) out.push(b);

    return new Uint8Array(out);

  async function decode(name, data, parms) {
    switch (name) {
      case "FlateDecode":
      case "Fl": {
        const inflated = await inflate(data);
        return applyPredictor(inflated, parms || {});
      }
      case "ASCIIHexDecode":
      case "AHx":
        return asciiHexDecode(data);
      case "ASCII85Decode":
      case "A85":
        return ascii85Decode(data);
      case "RunLengthDecode":
      case "RL":
        return runLengthDecode(data);
      case "DCTDecode":
      case "JPXDecode":
      case "CCITTFaxDecode":
      case "JBIG2Decode":
        // 画像系フィルタは対象外（線分抽出には不要）
        throw new Error("IMAGE_FILTER");
      default:
        throw new Error("未対応のフィルタです: " + name);
    }
  }

  function num(v, def) {
    return typeof v === "number" && isFinite(v) ? v : def;
  }

  function hexVal(c) {
    if (c >= 0x30 && c <= 0x39) return c - 0x30;
    if (c >= 0x41 && c <= 0x46) return c - 0x41 + 10;
    if (c >= 0x61 && c <= 0x66) return c - 0x61 + 10;
    return -1;
  }

/* ===== 11_lexer.js ===== */
// PDF 構文の字句解析とオブジェクト組み立て
// ファイル本体・xref・コンテントストリーム・CMap で共用する。
(function (ZC) {
  "use strict";

  class Name {
    constructor(n) {
      this.name = n;
    }
  }
  class Ref {
    constructor(num, gen) {
      this.num = num;
      this.gen = gen;
    }
  }
  class PStr {
    // PDF 文字列（リテラル/16進）。テキスト表示のためバイト列のまま保持する
    constructor(bytes) {
      this.bytes = bytes;
    }
  }

  function isWs(c) {
    return c === 0 || c === 9 || c === 10 || c === 12 || c === 13 || c === 32;
  }
  function isDelim(c) {
    return (
      c === 0x28 || c === 0x29 || c === 0x3c || c === 0x3e || c === 0x5b ||
      c === 0x5d || c === 0x7b || c === 0x7d || c === 0x2f || c === 0x25
    );
  }

  class Lexer {
    constructor(bytes, pos) {
      this.b = bytes;
      this.pos = pos || 0;
    }

    skipWs() {
      const b = this.b;
      for (;;) {
        while (this.pos < b.length && isWs(b[this.pos])) this.pos++;
        if (b[this.pos] === 0x25) {
          // % コメント: 行末まで
          while (this.pos < b.length && b[this.pos] !== 10 && b[this.pos] !== 13) this.pos++;
          continue;
        }
        return;
      }
    }

    readToken() {
      this.skipWs();
      const b = this.b;
      if (this.pos >= b.length) return null;
      const c = b[this.pos];
      if (c === 0x3c) {
        if (b[this.pos + 1] === 0x3c) {
          this.pos += 2;
          return { t: "<<" };
        }
        return { t: "str", v: this.readHexString() };
      }
      if (c === 0x3e) {
        if (b[this.pos + 1] === 0x3e) {
          this.pos += 2;
          return { t: ">>" };
        }
        this.pos++;
        return { t: "junk" };
      }
      if (c === 0x28) return { t: "str", v: this.readLiteralString() };
      if (c === 0x2f) return { t: "name", v: this.readName() };
      if (c === 0x5b) { this.pos++; return { t: "[" }; }
      if (c === 0x5d) { this.pos++; return { t: "]" }; }
      if (c === 0x7b) { this.pos++; return { t: "{" }; }
      if (c === 0x7d) { this.pos++; return { t: "}" }; }
      if (c === 0x29) { this.pos++; return { t: "junk" }; }
      if ((c >= 0x30 && c <= 0x39) || c === 0x2b || c === 0x2d || c === 0x2e) {
        return { t: "num", v: this.readNumber() };
      }
      const kw = this.readKeyword();
      return { t: "kw", v: kw };
    }

    readNumber() {
      const b = this.b;
      const start = this.pos;
      this.pos++;
      while (this.pos < b.length) {
        const c = b[this.pos];
        if ((c >= 0x30 && c <= 0x39) || c === 0x2e || c === 0x2b || c === 0x2d) this.pos++;
        else break;
      }
      const v = parseFloat(ZC.util.latin1(b, start, this.pos));
      return isFinite(v) ? v : 0;
    }

    readKeyword() {
      const b = this.b;
      const start = this.pos;
      while (this.pos < b.length && !isWs(b[this.pos]) && !isDelim(b[this.pos])) this.pos++;
      if (this.pos === start) this.pos++; // 不正バイトで停止しない
      return ZC.util.latin1(b, start, this.pos);
    }

    readName() {
      const b = this.b;
      this.pos++; // '/'
      let s = "";
      while (this.pos < b.length && !isWs(b[this.pos]) && !isDelim(b[this.pos])) {
        let c = b[this.pos];
        if (c === 0x23 && this.pos + 2 < b.length) {
          const h = parseInt(ZC.util.latin1(b, this.pos + 1, this.pos + 3), 16);
          if (isFinite(h)) {
            s += String.fromCharCode(h);
            this.pos += 3;
            continue;
          }

        s += String.fromCharCode(c);
        this.pos++;
      }
      return s;
    }

    readLiteralString() {
      const b = this.b;
      this.pos++; // '('
      const out = [];
      let depth = 1;
      while (this.pos < b.length) {
        let c = b[this.pos++];
        if (c === 0x5c) {
          // バックスラッシュエスケープ
          const e = b[this.pos++];
          switch (e) {
            case 0x6e: out.push(10); break; // \n
            case 0x72: out.push(13); break; // \r
            case 0x74: out.push(9); break;  // \t
            case 0x62: out.push(8); break;  // \b
            case 0x66: out.push(12); break; // \f
            case 0x28: out.push(0x28); break;
            case 0x29: out.push(0x29); break;
            case 0x5c: out.push(0x5c); break;

            case 10: break;

                // 8進数 1〜3桁
                let v = e - 0x30;

// 縮尺推定: 隣り合う通り芯の間に書かれた寸法値から mm/pt を求める
(function (ZC) {
  "use strict";

  const PARAMS = {
    MIN_GAP: 8,        // 寸法探索の対象にする最小の芯間隔(pt)
    MID_RATIO: 0.35,   // 寸法値は区間中央からこの比率以内にあること
    PERP_MARGIN: 80,   // 芯の長さ方向の探索マージン(pt)
    CLUSTER_REL: 0.025 // 同一縮尺とみなす mm/pt の相対差
  };

  // 有効な芯リストと全テキストから「芯ペアに対応する寸法値」を集める
  // 戻り値: [{dir, i, aName, bName, value, gapPt, mmPerPt, dist}]
  function collectDimSamples(vAxes, hAxes, texts) {
    const dims = [];
    for (const t of texts) {
      const value = U.parseDimNumber(t.str);
      if (value == null) continue;
      dims.push({
        value,
        x: (t.x + (t.ex !== undefined ? t.ex : t.x)) / 2,
        y: (t.y + (t.ey !== undefined ? t.ey : t.y)) / 2,
      });
    }
    if (!dims.length) return [];
    const samples = [];
    for (const [dir, axes] of [["v", vAxes], ["h", hAxes]]) {
      const sorted = axes.slice().sort((p, q) => p.pos - q.pos);
      for (let i = 0; i + 1 < sorted.length; i++) {
        const a = sorted[i];
        const b = sorted[i + 1];
        const gap = b.pos - a.pos;
        if (gap < PARAMS.MIN_GAP) continue;
        const mid = (a.pos + b.pos) / 2;
        const perpLo = Math.min(a.from, b.from) - PARAMS.PERP_MARGIN;
        const perpHi = Math.max(a.to, b.to) + PARAMS.PERP_MARGIN;
        let bestDim = null;
        let bestDist = Infinity;
        for (const d of dims) {
          const along = dir === "v" ? d.x : d.y;
          const perp = dir === "v" ? d.y : d.x;
          if (perp < perpLo || perp > perpHi) continue;
          const off = Math.abs(along - mid);
          if (off > gap * PARAMS.MID_RATIO) continue;
          if (off < bestDist) {
            bestDist = off;
            bestDim = d;
          }
        }
        if (bestDim) {
          samples.push({
            dir,
            i,
            a,
            b,
            value: bestDim.value,
            gapPt: gap,
            mmPerPt: bestDim.value / gap,
            dist: bestDist,
          });
        }
      }
    }
    return samples;
  }

  // サンプル群から縮尺を推定する
  // 戻り値: {den, mmPerPt, snapped, count} または den=null（推定不能）
  function infer(samples) {
    if (!samples.length) return { den: null, mmPerPt: null, snapped: false, count: 0 };
    const vals = samples.map((s) => s.mmPerPt).sort((a, b) => a - b);
    // 相対差 CLUSTER_REL 以内に収まる最大の窓を探す
    let bestLo = 0;
    let bestN = 1;
    for (let lo = 0, hi = 0; lo < vals.length; lo++) {
      if (hi < lo) hi = lo;
      while (hi + 1 < vals.length && vals[hi + 1] <= vals[lo] * (1 + PARAMS.CLUSTER_REL)) hi++;
      if (hi - lo + 1 > bestN) {
        bestN = hi - lo + 1;
        bestLo = lo;
      }

// 照合: 基準図面と比較図面の通り芯を対応付け、符号・芯々寸法・全体寸法の差異を洗い出す

  "use strict";

  const U = ZC.util;

  const PARAMS = {
    MATCH_TOL_MM: 25, // 位置による対応付けの最大ずれ(mm)

        for (const m of matches) {
          if (m.b.label != null && m.c.label != null && m.b.label !== m.c.label) {
            rows.push(row("符号", dir, m.b.name + " ↔ " + m.c.name, m.b.label, m.c.label, null, "NG", "符号が一致しません"));
            ngCount++;
          }
        }
        for (const b of bOnly) {
          rows.push(row("符号", dir, b.name, "あり", "なし", null, b.label != null ? "NG" : "WARN", "比較図面に対応する芯がありません"));
          ngCount++;
        }
        for (const c of cOnly) {
          rows.push(row("符号", dir, c.name, "なし", "あり", null, c.label != null ? "NG" : "WARN", "基準図面に対応する芯がありません"));
          ngCount++;
        }
        if (!ngCount && matches.length) {
          rows.push(
            row("符号", dir, "全" + matches.length + "本", matches.map((m) => m.b.name).join(" "), "対応あり", null, "OK", "")
          );
        }
      }

      if (checks.spacing !== false) {
        for (let i = 0; i + 1 < matches.length; i++) {
          const p = matches[i];
          const q = matches[i + 1];
          const dB = q.b.mm - p.b.mm;
          const dC = q.c.mm - p.c.mm;
          const diff = dC - dB;
          rows.push(
            row(
              "芯々寸法",
              dir,
              p.b.name + "〜" + q.b.name,
              U.fmtMm(dB),
              U.fmtMm(dC),
              diff,
              Math.abs(diff) <= tol ? "OK" : "NG",
              ""
            )
          );
        }
      }

      if (checks.total !== false && matches.length >= 2) {
        const p = matches[0];
        const q = matches[matches.length - 1];
        const dB = q.b.mm - p.b.mm;
        const dC = q.c.mm - p.c.mm;
        const diff = dC - dB;
        rows.push(
          row(
            "全体寸法",
            dir,
            p.b.name + "〜" + q.b.name,
            U.fmtMm(dB),
            U.fmtMm(dC),
            diff,
            Math.abs(diff) <= tol ? "OK" : "NG",
            ""

    // 図面内の寸法注記と作図位置の食い違い（各図面ごと）
    if (checks.dims) {
      for (const side of [base, cmp]) {
        for (const s of side.dimSamples || []) {
          const geomMm = s.gapPt * side.mmPerPt;
          const diff = geomMm - s.value;
          rows.push(
            row(
              "寸法値整合(" + side.name + ")",
              s.dir,
              nameOf(s.a) + "〜" + nameOf(s.b),
              U.fmtMm(s.value, 0),
              U.fmtMm(geomMm),
              diff,
              Math.abs(diff) <= tol ? "OK" : "NG",
              "注記寸法と作図上の芯々距離の比較"

        }
      }

          const on = this.enabled.size;
          this.setStatus(
            "通り芯候補: 縦" + det.v.length + "本 / 横" + det.h.length + "本（うち" + on + "本をチェック済み）。誤検出はチェックを外してください。"
          );
        }
      } catch (e) {
        this.extract = null;
        this.axes = { v: [], h: [] };
        this.setStatus("解析に失敗しました: " + (e && e.message ? e.message : e), "error");
      }
      this.renderCanvas();
      this.renderList();
      ZC.ui.updateRunButton();
    }

    allAxes() {
      return this.axes.v.concat(this.axes.h);
    }

    enabledAxes() {
      return {
        v: this.axes.v.filter((a) => this.enabled.has(a)),
        h: this.axes.h.filter((a) => this.enabled.has(a)),
      };
    }

    mmPerPt() {
      const den = Number(this.$scale.value);
      return den > 0 ? ZC.scale.mmPerPtFromDen(den) : null;
    }

    ready() {
      return !!(this.extract && (this.enabled.size >= 1) && this.mmPerPt());
    }

    renderCanvas() {
      const cv = this.$canvas;
      const cssW = cv.clientWidth || 600;
      const cssH = 380;
      const dpr = (globalThis.devicePixelRatio || 1);
      cv.width = Math.round(cssW * dpr);
      cv.height = Math.round(cssH * dpr);
      const ctx = cv.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, cssW, cssH);
      if (!this.extract || !this.extract.segments.length) {
        ctx.fillStyle = "#8a939b";
        ctx.font = "13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(this.doc ? "表示できる線分がありません" : "PDFを読み込むとここにプレビューが表示されます", cssW / 2, cssH / 2);
        return;
      }
      const pw = this.extract.width;
      const ph = this.extract.height;
      const pad = 8;
      const sc = Math.min((cssW - pad * 2) / pw, (cssH - pad * 2) / ph);
      const ox = (cssW - pw * sc) / 2;
      const oy = (cssH - ph * sc) / 2;
      const X = (x) => ox + x * sc;
      const Y = (y) => oy + (ph - y) * sc; // PDFはy上向き

      // 全線分（下地）
      ctx.lineWidth = 0.6;
      ctx.strokeStyle = COLORS.seg;
      ctx.beginPath();
      const segs = this.extract.segments;
      const maxDraw = 150000;
      for (let i = 0; i < segs.length && i < maxDraw; i++) {
        const s = segs[i];
        ctx.moveTo(X(s.x1), Y(s.y1));
        ctx.lineTo(X(s.x2), Y(s.y2));
      }
      ctx.stroke();

      // 通り芯の重ね描き
      for (const ax of this.allAxes()) {
        const on = this.enabled.has(ax);
        const hover = this.hoverAx === ax;
        ctx.lineWidth = hover ? 2.5 : on ? 1.6 : 1;
        ctx.strokeStyle = hover ? COLORS.hover : !on ? COLORS.off : ax.dir === "v" ? COLORS.v : COLORS.h;
        ctx.setLineDash(on || hover ? [7, 3, 2, 3] : [2, 3]);
        ctx.beginPath();
        if (ax.dir === "v") {
          ctx.moveTo(X(ax.pos), Y(ax.from));
          ctx.lineTo(X(ax.pos), Y(ax.to));
        } else {
          ctx.moveTo(X(ax.from), Y(ax.pos));
          ctx.lineTo(X(ax.to), Y(ax.pos));
        }
        ctx.stroke();
        ctx.setLineDash([]);
        if (on || hover) {
          const name = ZC.axis.displayName(ax);
          ctx.fillStyle = hover ? COLORS.hover : ax.dir === "v" ? COLORS.v : COLORS.h;
          ctx.font = "bold 11px sans-serif";
          ctx.textAlign = "center";
          if (ax.dir === "v") ctx.fillText(name, X(ax.pos), Y(ax.to) - 4);
          else {
            ctx.textAlign = "right";
            ctx.fillText(name, X(ax.from) - 4, Y(ax.pos) + 4);
          }
        }
      }
    }

    renderList() {
      this.$list.innerHTML = "";
      const axes = this.allAxes();
      if (!axes.length) return;
      const table = el("table", { class: "axes" });
      const thead = el("thead");
      thead.innerHTML =
        "<tr><th>照合</th><th>方向</th><th>符号</th><th>位置(mm)</th><th>長さ(mm)</th><th>線種</th></tr>";
      table.appendChild(thead);
      const tbody = el("tbody");
      const mmPerPt = this.mmPerPt() || 0;
      const list = this.axes.v.concat(this.axes.h);
      for (const ax of list) {
        const tr = el("tr", {
          class: this.enabled.has(ax) ? "" : "off",
          onmouseenter: () => {
            this.hoverAx = ax;
            this.renderCanvas();
          },
          onmouseleave: () => {
            this.hoverAx = null;
            this.renderCanvas();
          },
        });
        const cb = el("input", { type: "checkbox" });
        cb.checked = this.enabled.has(ax);
        cb.addEventListener("change", () => {
          if (cb.checked) this.enabled.add(ax);
          else this.enabled.delete(ax);
          tr.className = cb.checked ? "" : "off";
          this.renderCanvas();
          ZC.ui.updateRunButton();
        });
        tr.appendChild(el("td", {}, [cb]));
        tr.appendChild(el("td", { text: ax.dir === "v" ? "縦" : "横" }));
        tr.appendChild(el("td", { text: ZC.axis.displayName(ax) + (ax.label == null ? "（符号なし）" : "") }));
        tr.appendChild(el("td", { text: mmPerPt ? U.fmtMm(ax.pos * mmPerPt, 0) : "—" }));
        tr.appendChild(el("td", { text: mmPerPt ? U.fmtMm(ax.extent * mmPerPt, 0) : "—" }));
        tr.appendChild(
          el("td", {
            text: (ax.dashed ? "鎖線/破線" : "実線") + (ax.frameSuspect ? "・図枠?" : ""),
          })
        );
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      this.$list.appendChild(table);
    }
  }

  const ui = {
    base: null,
    cmp: null,
    lastResult: null,

    init() {
      document.querySelectorAll(".ver").forEach((e) => (e.textContent = "v" + ZC.VERSION));
      ui.base = new Panel("base", "基準図面", document.getElementById("panel-base-body"));
      ui.cmp = new Panel("cmp", "比較図面", document.getElementById("panel-cmp-body"));
      document.getElementById("run-check").addEventListener("click", () => ui.runCheck());
      document.getElementById("csv-dl").addEventListener("click", () => ui.downloadCsv());
      globalThis.addEventListener("resize", () => {
        ui.base.renderCanvas();
        ui.cmp.renderCanvas();
      });
      ui.updateRunButton();
    },

    updateRunButton() {
      const btn = document.getElementById("run-check");
      if (btn) btn.disabled = !(ui.base && ui.cmp && ui.base.ready() && ui.cmp.ready());
    },

    gatherSide(panel, name) {
      const en = panel.enabledAxes();
      const mmPerPt = panel.mmPerPt();
      return {
        v: en.v,
        h: en.h,
        mmPerPt,
        dimSamples: ZC.scale.collectDimSamples(en.v, en.h, panel.extract.texts),
        name,
      };
    },

    runCheck() {
      const tol = Number(document.getElementById("tol").value) || 1;
      const checks = {
        labels: document.getElementById("ck-labels").checked,
        spacing: document.getElementById("ck-spacing").checked,
        total: document.getElementById("ck-total").checked,
        dims: document.getElementById("ck-dims").checked,
      };
      const base = ui.gatherSide(ui.base, "基準");
      const cmp = ui.gatherSide(ui.cmp, "比較");
      const result = ZC.compare.compare(base, cmp, { tol, checks });
      ui.lastResult = result;
      ui.renderResult(result, tol);
    },

    renderResult(result, tol) {
      const wrap = document.getElementById("result");
      wrap.innerHTML = "";
      const s = result.summary;
      const sumCls = s.ng ? "ng" : s.warn ? "warn" : "ok";
      wrap.appendChild(
        el("div", {
          class: "summary " + sumCls,
          text:
            (s.ng ? "NG " + s.ng + "件" : "NGなし") +
            (s.warn ? " / 要確認 " + s.warn + "件" : "") +
            " / OK " + s.ok + "件" +
            "（許容差 ±" + tol + "mm）",
        })
      );
      if (!result.rows.length) {
        wrap.appendChild(el("p", { text: "チェック項目が選択されていないか、対応する芯がありません。" }));
        document.getElementById("csv-dl").hidden = true;
        return;
      }
      const table = el("table", { class: "result" });
      const thead = el("thead");
      thead.innerHTML =
        "<tr><th>判定</th><th>チェック</th><th>方向</th><th>対象</th><th>基準</th><th>比較</th><th>差(mm)</th><th>備考</th></tr>";
      table.appendChild(thead);
      const tbody = el("tbody");
      for (const r of result.rows) {
        const tr = el("tr", { class: r.status.toLowerCase() });
        tr.appendChild(el("td", { text: r.status === "WARN" ? "要確認" : r.status, class: "st" }));
        tr.appendChild(el("td", { text: r.check }));
        tr.appendChild(el("td", { text: r.dir }));
        tr.appendChild(el("td", { text: r.item }));
        tr.appendChild(el("td", { text: String(r.base) }));
        tr.appendChild(el("td", { text: String(r.cmp) }));
        tr.appendChild(el("td", { text: r.diff == null ? "—" : (r.diff > 0 ? "+" : "") + U.fmtMm(r.diff) }));
        tr.appendChild(el("td", { text: r.note }));
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);
      document.getElementById("csv-dl").hidden = false;
    },

    downloadCsv() {
      if (!ui.lastResult) return;
      const head = ["判定", "チェック", "方向", "対象", "基準", "比較", "差(mm)", "備考"];
      const lines = [head.join(",")];
      for (const r of ui.lastResult.rows) {
        const cells = [
          r.status,
          r.check,
          r.dir,
          r.item,
          String(r.base),
          String(r.cmp),
          r.diff == null ? "" : U.fmtMm(r.diff),
          r.note,
        ].map((c) => '"' + String(c).replace(/"/g, '""') + '"');
        lines.push(cells.join(","));
      }
      // Excel で文字化けしないよう BOM 付き UTF-8
      const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "zumen-check.csv";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
  };

  ZC.ui = ui;
})(globalThis.ZC = globalThis.ZC || {});

/* ===== 31_app.js ===== */
// 起動: ブラウザ上でのみ UI を初期化する（Node のテスト実行では何もしない）
(function (ZC) {
  "use strict";
  if (typeof document === "undefined" || !document.getElementById) return;
  const boot = () => {
    if (document.getElementById("panel-base-body")) ZC.ui.init();
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})(globalThis.ZC = globalThis.ZC || {});

</script>
</body>
