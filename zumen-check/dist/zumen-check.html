<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通り芯照合ツール</title>
<style>
  :root {
    --border: #d7dde3;
    --ink: #24313d;
    --sub: #5c6b78;
    --accent: #1565d8;
    --bg: #f2f5f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.6;
  }
  header {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .ver { color: var(--sub); font-size: 12px; }
  header .privacy { color: var(--sub); font-size: 12px; margin-left: auto; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px 20px 60px; }
  .panels { display: flex; gap: 16px; flex-wrap: wrap; }
  .panel {
    flex: 1 1 480px;
    min-width: 420px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px 16px;
  }
  .panel h2, #check h2 { font-size: 15px; margin: 0 0 10px; }
  .file-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .file-btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .file-btn:hover { filter: brightness(1.08); }
  .fname { color: var(--sub); font-size: 12px; word-break: break-all; }
  .ctrl-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; font-size: 13px; }
  .ctrl-row input[type="number"] { width: 70px; padding: 2px 4px; }
  .scale-note { color: var(--sub); font-size: 12px; }
  .status { min-height: 20px; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .status.error { color: #b30021; }
  .viewer-bar { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; font-size: 12px; flex-wrap: wrap; }
  .viewer-bar button {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 12px;
    cursor: pointer;
    font-size: 12px;
  }
  .viewer-bar button:hover { border-color: var(--accent); color: var(--accent); }
  .viewer-bar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .zoom-label { color: var(--sub); min-width: 42px; text-align: right; }
  .viewer-hint { color: #9aa4ad; margin-left: auto; }
  .viewer-wrap {
    position: relative;
    height: 380px;
    min-height: 240px;
    max-height: 840px;
    resize: vertical;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
  }
  .viewer-wrap canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  .axtip {
    position: absolute;
    pointer-events: none;
    background: rgba(36, 49, 61, 0.92);
    color: #fff;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    display: none;
    z-index: 5;
  }
  .axis-list { max-height: 260px; overflow: auto; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; background: #fff; }
  th, td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; white-space: nowrap; }
  th { background: #eef2f5; font-weight: 600; position: sticky; top: 0; }
  table.axes tr.off td { color: #a7b0b8; }
  table.axes tr.hl td { background: #fff3e0; }
  .result-hint { color: var(--sub); font-size: 12px; margin: 0 0 6px; }
  #check {
    margin-top: 16px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px 16px;
  }
  .check-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; font-size: 13px; }
  .check-row label { user-select: none; }
  #tol { width: 60px; padding: 2px 4px; }
  #run-check {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 22px;
    font-size: 14px;
    cursor: pointer;
  }
  #run-check:disabled { background: #b9c4ce; cursor: not-allowed; }
  #csv-dl {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    margin-left: 10px;
  }
  .summary { font-weight: 600; margin: 12px 0 8px; }
  .summary.ng { color: #b30021; }
  .summary.warn { color: #9a6b00; }
  .summary.ok { color: #0a7a3d; }
  table.result td.st { font-weight: 700; text-align: center; }
  table.result tr.ng { background: #fdebee; }
  table.result tr.ng td.st { color: #b30021; }
  table.result tr.warn { background: #fdf6e3; }
  table.result tr.warn td.st { color: #9a6b00; }
  table.result tr.ok td.st { color: #0a7a3d; }
  #result { overflow: auto; }
  footer { color: var(--sub); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <h1>通り芯照合ツール</h1>
  <span class="ver"></span>
  <span class="privacy">図面はブラウザ内でのみ処理され、外部には送信されません</span>
</header>
<main>
  <div class="panels">
    <section class="panel">
      <h2>1. 基準図面</h2>
      <div id="panel-base-body"></div>
    </section>
    <section class="panel">
      <h2>2. 比較図面</h2>
      <div id="panel-cmp-body"></div>
    </section>
  </div>
  <section id="check">
    <h2>3. チェック項目を選んで照合</h2>
    <div class="check-row">
      <label><input type="checkbox" id="ck-labels" checked> 通り芯符号の対応</label>
      <label><input type="checkbox" id="ck-spacing" checked> 芯々寸法</label>
      <label><input type="checkbox" id="ck-total" checked> 全体寸法</label>
      <label><input type="checkbox" id="ck-dims"> 寸法注記と作図位置の整合（各図面内）</label>
      <label>許容差 ± <input type="number" id="tol" value="1" min="0" step="0.5"> mm</label>
    </div>
    <button id="run-check" disabled>照合する</button>
    <button id="csv-dl" hidden>CSVダウンロード</button>
    <div id="result"></div>
  </section>
  <footer>
    <p>ベクターPDF専用（スキャンPDFは読み取れません）。検出されなかった箇所に差異が無いことを保証するものではありません。最終確認は必ず図面で行ってください。</p>
  </footer>
</main>
<script>
/* ===== 00_ns.js ===== */
// 通り芯照合ツール 名前空間
// 各ファイルは _order.json の順に連結される前提。import/export は使わない。
(function (g) {
  "use strict";
  g.ZC = g.ZC || {};
  g.ZC.VERSION = "1.2.0";
})(globalThis);

/* ===== 01_util.js ===== */
// 汎用ユーティリティ（文字正規化・行列・数値）
(function (ZC) {
  "use strict";

  // 全角英数記号→半角に寄せ、空白を除去して大文字化する（通り芯符号の比較用）
  function normalizeLabel(s) {
    let out = "";
    for (const ch of String(s)) {
      const c = ch.codePointAt(0);
      if (c === 0x3000 || c === 0x20 || c === 9 || c === 10 || c === 13) continue;
      if (c >= 0xff01 && c <= 0xff5e) {
        out += String.fromCharCode(c - 0xfee0);
        continue;
      }
      out += ch;
    }
    return out.toUpperCase();
  }

  // 寸法値らしい文字列を mm 数値へ（"6,000" → 6000、"2730.5" → 2730.5）。該当しなければ null
  // 小数点付きの寸法にも対応する。判定は寸法線（黒ドット間の直線）への位置付けと併用する前提。
  function parseDimNumber(s) {
    const t = normalizeLabel(s).replace(/,/g, "");
    if (!/^\d{2,5}(\.\d{1,3})?$/.test(t)) return null;
    const v = Number(t);
    return v >= 10 && v <= 99999 ? v : null;
  }

  // 通り芯符号: 縦方向（X方向）= X○○ / 横方向（Y方向）= Y○○ の記載のみを符号として拾う。
  // 番号は小数点付き（X2.5 など）も許容。該当すれば {dir:"v"|"h", label} を返す。
  function axisLabelOf(s) {
    const t = normalizeLabel(s);
    const m = /^([XY])(\d{1,3}(\.\d{1,2})?)$/.exec(t);
    if (!m) return null;
    return { dir: m[1] === "X" ? "v" : "h", label: t };
  }

  function median(arr) {
    if (!arr.length) return NaN;
    const a = arr.slice().sort((x, y) => x - y);
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  // PDF の行ベクトル規約 [a b c d e f]: p' = p・M
  const MAT = {
    id() {
      return [1, 0, 0, 1, 0, 0];
    },
    translate(tx, ty) {
      return [1, 0, 0, 1, tx, ty];
    },
    mul(a, b) {
      // a を先に適用してから b（p・a・b）
      return [
        a[0] * b[0] + a[1] * b[2],
        a[0] * b[1] + a[1] * b[3],
        a[2] * b[0] + a[3] * b[2],
        a[2] * b[1] + a[3] * b[3],
        a[4] * b[0] + a[5] * b[2] + b[4],
        a[4] * b[1] + a[5] * b[3] + b[5],
      ];
    },
    apply(m, x, y) {
      return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
    },
    // 等方近似の拡大率（線幅・文字サイズのデバイス換算に使う）
    scaleOf(m) {
      const det = Math.abs(m[0] * m[3] - m[1] * m[2]);
      return det > 0 ? Math.sqrt(det) : Math.hypot(m[0], m[1]);
    },
  };

  function latin1(bytes, start, end) {
    start = start || 0;
    if (end === undefined) end = bytes.length;
    let s = "";
    const CHUNK = 8192;
    for (let i = start; i < end; i += CHUNK) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(end, i + CHUNK)));
    }
    return s;
  }

  // バイト列から ASCII 文字列を探す（見つからなければ -1）
  function indexOfBytes(hay, needleStr, from) {
    const n = needleStr.length;
    const first = needleStr.charCodeAt(0);
    outer: for (let i = Math.max(0, from | 0); i <= hay.length - n; i++) {
      if (hay[i] !== first) continue;
      for (let j = 1; j < n; j++) {
        if (hay[i + j] !== needleStr.charCodeAt(j)) continue outer;
      }
      return i;
    }
    return -1;
  }

  function fmtMm(v, digits) {
    if (v == null || !isFinite(v)) return "—";
    const d = digits === undefined ? 1 : digits;
    const k = 10 ** d;
    const r = Math.round(v * k) / k;
    return (Object.is(r, -0) ? 0 : r).toFixed(d); // "-0.0" を出さない
  }

  ZC.util = { normalizeLabel, parseDimNumber, axisLabelOf, median, MAT, latin1, indexOfBytes, fmtMm };

/* ===== 10_filters.js ===== */
// PDF ストリームフィルタ（FlateDecode ほか）
// FlateDecode はブラウザ/Node 標準の DecompressionStream を使い、外部依存を持たない。
(function (ZC) {
  "use strict";

  function pump(format, bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
    return new Response(stream).arrayBuffer().then((b) => new Uint8Array(b));
  }

  function trimTrailingWs(bytes) {
    let end = bytes.length;
    while (end > 0 && [0, 9, 10, 12, 13, 32].includes(bytes[end - 1])) end--;
    return bytes.subarray(0, end);
  }

  async function inflate(bytes) {
    // zlib 形式 → 末尾ゴミ除去 → 生 deflate の順で試す（壊れ気味の PDF 対策）

      ["deflate", bytes],
      ["deflate", trimTrailingWs(bytes)],
      ["deflate-raw", bytes.length > 2 && (bytes[0] & 0x0f) === 8 ? bytes.subarray(2) : bytes],
    ];
    let lastErr = null;
    for (const [fmt, b] of attempts) {
      try {
        return await pump(fmt, b);
      } catch (e) {
        lastErr = e;
      }

    throw new Error("FlateDecodeに失敗しました: " + (lastErr && lastErr.message));
  }

  // PNG/TIFF Predictor（主に xref ストリームで使われる）
  function applyPredictor(data, parms) {
    const pred = num(parms.Predictor, 1);
    if (pred <= 1) return data;
    const colors = num(parms.Colors, 1);
    const bpc = num(parms.BitsPerComponent, 8);
    const cols = num(parms.Columns, 1);
    const bpp = Math.max(1, Math.ceil((colors * bpc) / 8));
    const rowLen = Math.ceil((colors * bpc * cols) / 8);
    if (pred === 2) {
      // TIFF: bpc=8 のみ対応
      if (bpc !== 8) return data;
      const out = data.slice();
      for (let r = 0; r + rowLen <= out.length; r += rowLen) {
        for (let i = bpp; i < rowLen; i++) out[r + i] = (out[r + i] + out[r + i - bpp]) & 0xff;
      }
      return out;
    }
    // PNG系: 各行の先頭 1 バイトがフィルタ種別
    const rows = Math.floor(data.length / (rowLen + 1));
    const out = new Uint8Array(rows * rowLen);
    let prev = new Uint8Array(rowLen);
    for (let r = 0; r < rows; r++) {
      const ft = data[r * (rowLen + 1)];
      const src = data.subarray(r * (rowLen + 1) + 1, (r + 1) * (rowLen + 1));
      const cur = out.subarray(r * rowLen, (r + 1) * rowLen);
      for (let i = 0; i < rowLen; i++) {
        const raw = src[i];
        const a = i >= bpp ? cur[i - bpp] : 0;
        const b = prev[i];
        const c = i >= bpp ? prev[i - bpp] : 0;
        let v;
        switch (ft) {
          case 0: v = raw; break;
          case 1: v = raw + a; break;
          case 2: v = raw + b; break;
          case 3: v = raw + ((a + b) >> 1); break;
          case 4: {
            const p = a + b - c;
            const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
            v = raw + (pa <= pb && pa <= pc ? a : pb <= pc ? b : c);
            break;
          }
          default: v = raw;
        }
        cur[i] = v & 0xff;
      }
      prev = cur;
    }
    return out;
  }

  function asciiHexDecode(bytes) {
    const out = [];
    let hi = -1;
    for (let i = 0; i < bytes.length; i++) {
      const c = bytes[i];
      if (c === 0x3e) break; // >
      const d = hexVal(c);
      if (d < 0) continue;
      if (hi < 0) hi = d;
      else {
        out.push(hi * 16 + d);
        hi = -1;
      }
    }
    if (hi >= 0) out.push(hi * 16);
    return new Uint8Array(out);
  }

  function ascii85Decode(bytes) {
    const out = [];
    let tuple = 0, count = 0;
    let i = 0;
    // 先頭の <~ を読み飛ばす
    if (bytes[0] === 0x3c && bytes[1] === 0x7e) i = 2;
    for (; i < bytes.length; i++) {
      const c = bytes[i];
      if (c === 0x7e) break; // ~>
      if ([0, 9, 10, 12, 13, 32].includes(c)) continue;
      if (c === 0x7a && count === 0) { // z = 0x00000000
        out.push(0, 0, 0, 0);

      if (c < 0x21 || c > 0x75) continue;
      tuple = tuple * 85 + (c - 0x21);
      if (++count === 5) {
        out.push((tuple >>> 24) & 0xff, (tuple >>> 16) & 0xff, (tuple >>> 8) & 0xff, tuple & 0xff);
        tuple = 0;
        count = 0;
      }
    }
    if (count > 0) {
      for (let j = count; j < 5; j++) tuple = tuple * 85 + 84;
      const b = [(tuple >>> 24) & 0xff, (tuple >>> 16) & 0xff, (tuple >>> 8) & 0xff, tuple & 0xff];
      for (let j = 0; j < count - 1; j++) out.push(b[j]);

    return new Uint8Array(out);
  }

  function runLengthDecode(bytes) {
    const out = [];
    let i = 0;
    while (i < bytes.length) {
      const l = bytes[i++];
      if (l === 128) break;
      if (l < 128) {
        for (let j = 0; j <= l; j++) out.push(bytes[i++]);
      } else {
        const b = bytes[i++];
        for (let j = 0; j < 257 - l; j++) out.push(b);
      }
    }
    return new Uint8Array(out);
  }

  async function decode(name, data, parms) {
    switch (name) {
      case "FlateDecode":
      case "Fl": {
        const inflated = await inflate(data);
        return applyPredictor(inflated, parms || {});
      }
      case "ASCIIHexDecode":
      case "AHx":
        return asciiHexDecode(data);
      case "ASCII85Decode":
      case "A85":
        return ascii85Decode(data);
      case "RunLengthDecode":
      case "RL":
        return runLengthDecode(data);
      case "DCTDecode":
      case "JPXDecode":
      case "CCITTFaxDecode":
      case "JBIG2Decode":

        throw new Error("IMAGE_FILTER");
      default:
        throw new Error("未対応のフィルタです: " + name);
    }
  }

  function num(v, def) {
    return typeof v === "number" && isFinite(v) ? v : def;
  }

  function hexVal(c) {
    if (c >= 0x30 && c <= 0x39) return c - 0x30;
    if (c >= 0x41 && c <= 0x46) return c - 0x41 + 10;
    if (c >= 0x61 && c <= 0x66) return c - 0x61 + 10;
    return -1;
  }

  ZC.filters = { inflate, applyPredictor, asciiHexDecode, ascii85Decode, runLengthDecode, decode };

/* ===== 11_lexer.js ===== */
// PDF 構文の字句解析とオブジェクト組み立て
// ファイル本体・xref・コンテントストリーム・CMap で共用する。
(function (ZC) {
  "use strict";

  class Name {
    constructor(n) {
      this.name = n;
    }
  }
  class Ref {
    constructor(num, gen) {
      this.num = num;
      this.gen = gen;
    }
  }
  class PStr {
    // PDF 文字列（リテラル/16進）。テキスト表示のためバイト列のまま保持する
    constructor(bytes) {
      this.bytes = bytes;
    }
  }

  function isWs(c) {
    return c === 0 || c === 9 || c === 10 || c === 12 || c === 13 || c === 32;
  }
  function isDelim(c) {
    return (
      c === 0x28 || c === 0x29 || c === 0x3c || c === 0x3e || c === 0x5b ||
      c === 0x5d || c === 0x7b || c === 0x7d || c === 0x2f || c === 0x25
    );
  }

  class Lexer {
    constructor(bytes, pos) {
      this.b = bytes;
      this.pos = pos || 0;
    }

    skipWs() {
      const b = this.b;
      for (;;) {
        while (this.pos < b.length && isWs(b[this.pos])) this.pos++;
        if (b[this.pos] === 0x25) {
          // % コメント: 行末まで
          while (this.pos < b.length && b[this.pos] !== 10 && b[this.pos] !== 13) this.pos++;
          continue;
        }
        return;
      }
    }

    readToken() {
      this.skipWs();
      const b = this.b;
      if (this.pos >= b.length) return null;
      const c = b[this.pos];
      if (c === 0x3c) {
        if (b[this.pos + 1] === 0x3c) {
          this.pos += 2;
          return { t: "<<" };
        }
        return { t: "str", v: this.readHexString() };
      }
      if (c === 0x3e) {
        if (b[this.pos + 1] === 0x3e) {
          this.pos += 2;
          return { t: ">>" };
        }
        this.pos++;
        return { t: "junk" };
      }
      if (c === 0x28) return { t: "str", v: this.readLiteralString() };
      if (c === 0x2f) return { t: "name", v: this.readName() };
      if (c === 0x5b) { this.pos++; return { t: "[" }; }
      if (c === 0x5d) { this.pos++; return { t: "]" }; }
      if (c === 0x7b) { this.pos++; return { t: "{" }; }
      if (c === 0x7d) { this.pos++; return { t: "}" }; }
      if (c === 0x29) { this.pos++; return { t: "junk" }; }
      if ((c >= 0x30 && c <= 0x39) || c === 0x2b || c === 0x2d || c === 0x2e) {
        return { t: "num", v: this.readNumber() };
      }
      const kw = this.readKeyword();
      return { t: "kw", v: kw };
    }

    readNumber() {
      const b = this.b;
      const start = this.pos;
      this.pos++;
      while (this.pos < b.length) {
        const c = b[this.pos];
        if ((c >= 0x30 && c <= 0x39) || c === 0x2e || c === 0x2b || c === 0x2d) this.pos++;
        else break;
      }
      const v = parseFloat(ZC.util.latin1(b, start, this.pos));
      return isFinite(v) ? v : 0;
    }

    readKeyword() {
      const b = this.b;

  "use strict";

  const U = ZC.util;

    MATCH_TOL_MM: 25, // 位置による対応付けの最大ずれ(mm)

  // side: {v:[axes], h:[axes], mmPerPt, entries, name}
  // opts: {tol, checks:{labels, spacing, total, dims}}
  function compare(base, cmp, opts) {
    const tol = opts.tol > 0 ? opts.tol : 1;
    const checks = opts.checks || {};
    const rows = [];

    for (const dir of ["v", "h"]) {
      const bList = prep(base[dir], base.mmPerPt);
      const cList = prep(cmp[dir], cmp.mmPerPt);
      const { matches, bOnly, cOnly } = matchAxes(bList, cList);

      if (checks.labels !== false) {
        let ngCount = 0;
        for (const m of matches) {
          if (m.b.label != null && m.c.label != null && m.b.label !== m.c.label) {
            rows.push(
              row("符号", dir, m.b.name + " ↔ " + m.c.name, m.b.label, m.c.label, null, "NG", "符号が一致しません", {
                b: [m.b.ax],
                c: [m.c.ax],
              })
            );
            ngCount++;
          }
        }
        for (const b of bOnly) {
          rows.push(
            row("符号", dir, b.name, "あり", "なし", null, b.label != null ? "NG" : "WARN", "比較図面に対応する芯がありません", {
              b: [b.ax],
              c: [],
            })
          );
          ngCount++;
        }
        for (const c of cOnly) {
          rows.push(
            row("符号", dir, c.name, "なし", "あり", null, c.label != null ? "NG" : "WARN", "基準図面に対応する芯がありません", {
              b: [],
              c: [c.ax],
            })
          );
          ngCount++;
        }
        if (!ngCount && matches.length) {
          rows.push(
            row("符号", dir, "全" + matches.length + "本", matches.map((m) => m.b.name).join(" "), "対応あり", null, "OK", "", {
              b: matches.map((m) => m.b.ax),
              c: matches.map((m) => m.c.ax),
            })
          );
        }
      }

      if (checks.spacing !== false) {
        for (let i = 0; i + 1 < matches.length; i++) {
          const p = matches[i];
          const q = matches[i + 1];
          const bv = pairValue(base, dir, p.b, q.b);
          const cv = pairValue(cmp, dir, p.c, q.c);
          pushValueRow(rows, "芯々寸法", dir, p, q, bv, cv, tol);
        }
      }

      if (checks.total !== false && matches.length >= 2) {
        const p = matches[0];
        const q = matches[matches.length - 1];
        const bv = pairValue(base, dir, p.b, q.b);
        const cv = pairValue(cmp, dir, p.c, q.c);
        pushValueRow(rows, "全体寸法", dir, p, q, bv, cv, tol);
      }
    }

    // 記載寸法と作図位置の食い違い（各図面ごと・注記が読めた区間のみ）
    if (checks.dims) {
      for (const side of [base, cmp]) {
        const isBase = side === base;
        for (const dir of ["v", "h"]) {
          const list = prep(side[dir], side.mmPerPt);
          for (let i = 0; i + 1 < list.length; i++) {
            const a = list[i];
            const b = list[i + 1];
            const annot = ZC.dims.spanValue(side.entries || [], dir, a.ax.pos, b.ax.pos);
            if (!annot) continue;

            const diff = geom - annot.value;

                U.fmtMm(geom),

  // 芯ペア間の値: 記載寸法（分割は合計）を優先し、無ければ作図距離×縮尺
  function pairValue(side, dir, a, b) {

  function pushValueRow(rows, check, dir, p, q, bv, cv, tol) {
    const diff = cv.value - bv.value;
    const notes = [];
    if (bv.parts && bv.parts.length > 1) notes.push("基準=" + bv.parts.join("+"));
    if (cv.parts && cv.parts.length > 1) notes.push("比較=" + cv.parts.join("+"));
    if (!bv.annotated && !cv.annotated) notes.push("記載寸法が見つからないため作図距離×縮尺で比較");
    else if (!bv.annotated) notes.push("基準は記載寸法が見つからず作図距離×縮尺");
    else if (!cv.annotated) notes.push("比較は記載寸法が見つからず作図距離×縮尺");
    if (bv.conflict || cv.conflict) notes.push("図面内の寸法段で値が食い違っています（要確認）");
    rows.push(
      row(
        check,
        dir,
        p.b.name + "〜" + q.b.name,
        U.fmtMm(bv.value),
        U.fmtMm(cv.value),
        diff,
        Math.abs(diff) <= tol ? "OK" : "NG",
        notes.join(" / "),
        { b: [p.b.ax, q.b.ax], c: [p.c.ax, q.c.ax] }

  function partsNote(annot) {

      label: ax.label != null ? ax.label : null,
      // UI の一覧と同じ表示名（検出時の連番）を使う
      name: nameOf(ax),

  }

  function matchAxes(bList, cList) {
    const matches = [];
    const usedC = new Set();
    const byLabel = new Map();
    for (const c of cList) {
      if (c.label != null && !byLabel.has(c.label)) byLabel.set(c.label, c);
    }
    const bRest = [];
    for (const b of bList) {
      const c = b.label != null ? byLabel.get(b.label) : undefined;
      if (c && !usedC.has(c)) {
        matches.push({ b, c });
        usedC.add(c);
      } else {
        bRest.push(b);
      }
    }
    let offset = 0;
    if (matches.length) {
      offset = U.median(matches.map((m) => m.c.mm - m.b.mm));
    } else if (bList.length && cList.length) {
      offset = cList[0].mm - bList[0].mm;
    }
    const cRest = cList.filter((c) => !usedC.has(c));
    for (const b of bRest) {
      let best = null;
      let bestD = PARAMS.MATCH_TOL_MM;
      for (const c of cRest) {

        if (d <= bestD) {
          bestD = d;
          best = c;
        }
      }
      if (best) {
        matches.push({ b, c: best });
        usedC.add(best);
      }

      cmp: cmpVal,

          this.setStatus(
            this.extract.imageCount > 0
              ? "線分を抽出できませんでした。スキャン（ラスタ）PDFの可能性があります。"
              : "線分を抽出できませんでした。",
            "error"
          );
        } else {
          const on = this.enabled.size;
          this.setStatus(
            "通り芯候補: 縦" + det.v.length + "本 / 横" + det.h.length + "本（うち" + on + "本をチェック済み）" +
              " / 記載寸法 " + this.dimsInfo.entries.length + "区間を読取。誤検出はチェックを外してください。"
          );
        }
      } catch (e) {
        this.extract = null;
        this.axes = { v: [], h: [] };
        this.dimsInfo = { dots: [], entries: [] };
        this.setStatus("解析に失敗しました: " + (e && e.message ? e.message : e), "error");
      }
      this.requestRender();
      this.renderList();
      ZC.ui.updateRunButton();
    }

    allAxes() {
      return this.axes.v.concat(this.axes.h);
    }

    enabledAxes() {
      return {
        v: this.axes.v.filter((a) => this.enabled.has(a)),
        h: this.axes.h.filter((a) => this.enabled.has(a)),
      };
    }

    mmPerPt() {
      const den = Number(this.$scale.value);
      return den > 0 ? ZC.scale.mmPerPtFromDen(den) : null;
    }

    ready() {
      return !!(this.extract && this.enabled.size >= 1 && this.mmPerPt());
    }

    setHighlight(axes) {
      this.highlightAxes = axes && axes.length ? axes : null;
      this.requestRender();
    }

    toggleAxis(ax) {
      if (this.enabled.has(ax)) this.enabled.delete(ax);
      else this.enabled.add(ax);
      const row = this._rowMap.get(ax);
      if (row) {
        row.cb.checked = this.enabled.has(ax);
        row.tr.classList.toggle("off", !this.enabled.has(ax));
      }
      this.requestRender();
      ZC.ui.updateRunButton();
    }

    // ---- 座標変換 -------------------------------------------------------
    // ページ座標(pt, y上向き) ⇔ キャンバスCSS座標(y下向き)

    toScreen(x, y) {
      const v = this.view;
      return [v.ox + x * v.scale, v.oy + (this.extract.height - y) * v.scale];
    }

    toPage(sx, sy) {
      const v = this.view;
      return [(sx - v.ox) / v.scale, this.extract.height - (sy - v.oy) / v.scale];
    }

    fit() {
      if (!this.extract) return;
      const W = this.$canvas.clientWidth || 600;
      const H = this.$canvas.clientHeight || 380;
      const pad = 10;
      const k = Math.min((W - pad * 2) / this.extract.width, (H - pad * 2) / this.extract.height);
      this.view = {
        scale: k,
        ox: (W - this.extract.width * k) / 2,
        oy: (H - this.extract.height * k) / 2,
        fitScale: k,
      };
    }

    // ---- 入力イベント ----------------------------------------------------

    _onWheel(e) {
      if (!this.extract) return;
      e.preventDefault();
      if (!this.view) this.fit();
      const v = this.view;
      const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
      const k2 = Math.min(v.fitScale * 800, Math.max(v.fitScale * 0.15, v.scale * factor));
      const mx = e.offsetX;
      const my = e.offsetY;
      v.ox = mx - ((mx - v.ox) * k2) / v.scale;
      v.oy = my - ((my - v.oy) * k2) / v.scale;
      v.scale = k2;
      this.requestRender();
    }

    _onDown(e) {
      if (!this.extract || e.button !== 0) return;
      e.preventDefault();
      this._drag = { mx: e.offsetX, my: e.offsetY, ox: this.view.ox, oy: this.view.oy, moved: false };
    }

    _onMove(e) {
      if (!this.extract || !this.view) return;
      const mx = e.offsetX;
      const my = e.offsetY;
      if (this._drag) {
        const dx = mx - this._drag.mx;
        const dy = my - this._drag.my;
        if (Math.abs(dx) + Math.abs(dy) > 3) this._drag.moved = true;
        if (this._drag.moved) {
          this.view.ox = this._drag.ox + dx;
          this.view.oy = this._drag.oy + dy;
          this.$canvas.style.cursor = "grabbing";
          this._tip(null);
          this.requestRender();
          return;
        }
      }
      if (this.measuring) {
        const [px, py] = this.toPage(mx, my);
        this._measureCursor = this._snap(px, py);
        this._tip(null);
        this.requestRender();
        return;
      }
      // ホバー判定
      const hit = this._hitAxis(mx, my);
      if (hit !== this.hoverAx) {
        this.hoverAx = hit;
        this._syncRowHl();
        this.requestRender();
      }
      this.$canvas.style.cursor = hit ? "pointer" : "grab";
      this._tip(hit, mx, my);
    }

    _onUp(e) {
      if (!this.extract || !this.view) return;
      const wasDrag = this._drag && this._drag.moved;
      this._drag = null;
      this.$canvas.style.cursor = this.measuring ? "crosshair" : "grab";
      if (wasDrag) return;
      const mx = e.offsetX;
      const my = e.offsetY;
      if (this.measuring) {
        const [px, py] = this.toPage(mx, my);
        const pt = this._snap(px, py);
        if (!this.measureTemp) {
          this.measureTemp = pt;
          this.measure = null;
        } else {
          this.measure = { a: this.measureTemp, b: pt };
          this.measureTemp = null;
        }
        this.requestRender();
        return;
      }
      const hit = this._hitAxis(mx, my);
      if (hit) {
        this.toggleAxis(hit);
        this._tip(hit, mx, my); // ON/OFF後の状態をツールチップへ即反映
      }
    }

    // 画面座標での芯のヒットテスト（6px以内）
    _hitAxis(mx, my) {
      if (!this.view) return null;
      let best = null;
      let bestD = 6;
      for (const ax of this.allAxes()) {
        let d;
        if (ax.dir === "v") {
          const [sx] = this.toScreen(ax.pos, 0);
          const [, sy1] = this.toScreen(0, ax.to);
          const [, sy2] = this.toScreen(0, ax.from);
          if (my < sy1 - 6 || my > sy2 + 6) continue;
          d = Math.abs(mx - sx);
        } else {
          const [, sy] = this.toScreen(0, ax.pos);
          const [sx1] = this.toScreen(ax.from, 0);
          const [sx2] = this.toScreen(ax.to, 0);
          if (mx < sx1 - 6 || mx > sx2 + 6) continue;
          d = Math.abs(my - sy);
        }
        if (d < bestD) {
          bestD = d;
          best = ax;
        }
      }
      return best;
    }

    // 測定点のスナップ（芯の位置・線分端点）
    _snap(px, py) {
      const tol = 8 / this.view.scale;
      let sx = px;
      let sy = py;
      let dx = tol;
      let dy = tol;
      let snapped = false;
      for (const ax of this.allAxes()) {
        if (ax.dir === "v") {
          const d = Math.abs(px - ax.pos);
          if (d < dx) {
            dx = d;
            sx = ax.pos;
            snapped = true;
          }
        } else {
          const d = Math.abs(py - ax.pos);
          if (d < dy) {
            dy = d;
            sy = ax.pos;
            snapped = true;
          }
        }
      }
      if (this.extract.segments.length <= 30000) {
        // 端点は「現在のスナップ結果より近い」場合のみ採用する
        let bd = snapped ? Math.hypot(sx - px, sy - py) : tol;
        for (const s of this.extract.segments) {
          const d1 = Math.hypot(px - s.x1, py - s.y1);
          if (d1 < bd) {
            bd = d1;
            sx = s.x1;
            sy = s.y1;
            snapped = true;
          }
          const d2 = Math.hypot(px - s.x2, py - s.y2);
          if (d2 < bd) {
            bd = d2;
            sx = s.x2;
            sy = s.y2;
            snapped = true;
          }
        }
      }
      return { x: sx, y: sy, snapped };
    }

    _tip(ax, mx, my) {
      if (!ax) {
        this.$tip.style.display = "none";
        return;
      }
      const mmp = this.mmPerPt();
      const pos = mmp ? U.fmtMm(ax.pos * mmp, 0) + " mm" : U.fmtMm(ax.pos, 1) + " pt";
      const len = mmp ? U.fmtMm(ax.extent * mmp, 0) + " mm" : U.fmtMm(ax.extent, 1) + " pt";
      this.$tip.textContent =
        ZC.axis.displayName(ax) +
        "  位置 " + pos + " / 長さ " + len +
        " / " + (ax.dashed ? "鎖線" : "実線") +
        (ax.frameSuspect ? "・図枠?" : "") +
        (this.enabled.has(ax) ? " / 照合対象" : " / 対象外（クリックでON）");
      this.$tip.style.display = "block";
      const ww = this.$wrap.clientWidth;
      const tw = this.$tip.offsetWidth;
      this.$tip.style.left = Math.max(2, Math.min(mx + 14, ww - tw - 4)) + "px";
      this.$tip.style.top = my + 16 + "px";
    }

    _syncRowHl() {
      for (const [ax, row] of this._rowMap) {
        row.tr.classList.toggle("hl", ax === this.hoverAx);
      }
    }

    // ---- 描画 ------------------------------------------------------------

    requestRender() {
      if (this._raf) return;
      const raf = typeof requestAnimationFrame === "function" ? requestAnimationFrame : (f) => setTimeout(f, 16);
      this._raf = raf(() => {
        this._raf = 0;
        this.renderCanvas();
      });
    }

    renderCanvas() {
      const cv = this.$canvas;
      const cssW = cv.clientWidth || 600;
      const cssH = cv.clientHeight || 380;
      const dpr = globalThis.devicePixelRatio || 1;
      if (cv.width !== Math.round(cssW * dpr) || cv.height !== Math.round(cssH * dpr)) {
        cv.width = Math.round(cssW * dpr);
        cv.height = Math.round(cssH * dpr);
      }
      const ctx = cv.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, cssW, cssH);
      if (!this.extract || !this.extract.segments.length) {
        this.$zoom.textContent = "—";
        ctx.fillStyle = "#8a939b";
        ctx.font = "13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(
          this.doc ? "表示できる線分がありません" : "PDFを読み込むとここにプレビューが表示されます",
          cssW / 2,
          cssH / 2
        );
        return;
      }
      if (!this.view) this.fit();
      const v = this.view;
      this.$zoom.textContent = Math.round((v.scale / v.fitScale) * 100) + "%";

      // 可視範囲（ページ座標）— 範囲外の線分は描かない
      const [px0, py1] = this.toPage(0, 0);
      const [px1, py0] = this.toPage(cssW, cssH);
      const m = 2 / v.scale;

      ctx.lineWidth = 0.6;
      ctx.strokeStyle = COLORS.seg;
      ctx.beginPath();
      const segs = this.extract.segments;
      const maxDraw = 200000;
      for (let i = 0; i < segs.length && i < maxDraw; i++) {
        const s = segs[i];
        if (Math.max(s.x1, s.x2) < px0 - m || Math.min(s.x1, s.x2) > px1 + m) continue;
        if (Math.max(s.y1, s.y2) < py0 - m || Math.min(s.y1, s.y2) > py1 + m) continue;
        const a = this.toScreen(s.x1, s.y1);
        const b = this.toScreen(s.x2, s.y2);
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
      }
      ctx.stroke();

      this._drawHighlightBand(ctx);
      this._drawAxes(ctx);
      if (this.showDims) this._drawDims(ctx);
      this._drawMeasure(ctx);
    }

    _axisScreenSeg(ax) {
      if (ax.dir === "v") {
        const [sx] = this.toScreen(ax.pos, 0);
        const [, sy1] = this.toScreen(0, ax.to);
        const [, sy2] = this.toScreen(0, ax.from);
        return [sx, sy1, sx, sy2];
      }
      const [, sy] = this.toScreen(0, ax.pos);
      const [sx1] = this.toScreen(ax.from, 0);
      const [sx2] = this.toScreen(ax.to, 0);
      return [sx1, sy, sx2, sy];
    }

    _drawAxes(ctx) {
      const hl = this.highlightAxes;
      for (const ax of this.allAxes()) {
        const on = this.enabled.has(ax);
        const hover = this.hoverAx === ax || (hl && hl.includes(ax));
        ctx.lineWidth = hover ? 2.5 : on ? 1.6 : 1;
        ctx.strokeStyle = hover ? COLORS.hover : !on ? COLORS.off : ax.dir === "v" ? COLORS.v : COLORS.h;
        ctx.setLineDash(on || hover ? [7, 3, 2, 3] : [2, 3]);
        const [x1, y1, x2, y2] = this._axisScreenSeg(ax);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.setLineDash([]);
        if (on || hover) {
          const name = ZC.axis.displayName(ax);
          ctx.fillStyle = hover ? COLORS.hover : ax.dir === "v" ? COLORS.v : COLORS.h;
          ctx.font = "bold 11px sans-serif";
          if (ax.dir === "v") {
            ctx.textAlign = "center";
            haloText(ctx, name, x1, y1 - 4);
          } else {
            ctx.textAlign = "right";
            haloText(ctx, name, x1 - 4, y1 + 4);
          }
        }
      }
    }

    // 照合結果ホバー時の強調帯（2本ならその間を塗る）
    _drawHighlightBand(ctx) {
      const hl = this.highlightAxes;
      if (!hl || hl.length < 2) return;
      const dirs = new Set(hl.map((a) => a.dir));
      if (dirs.size !== 1) return;
      const sorted = hl.slice().sort((a, b) => a.pos - b.pos);
      const a = sorted[0];
      const b = sorted[sorted.length - 1];
      ctx.fillStyle = "rgba(245,130,10,0.13)";
      if (a.dir === "v") {
        const [x1] = this.toScreen(a.pos, 0);
        const [x2] = this.toScreen(b.pos, 0);
        const [, yTop] = this.toScreen(0, Math.max(a.to, b.to));
        const [, yBot] = this.toScreen(0, Math.min(a.from, b.from));
        ctx.fillRect(x1, yTop, x2 - x1, yBot - yTop);
      } else {
        const [, y1] = this.toScreen(0, b.pos);
        const [, y2] = this.toScreen(0, a.pos);
        const [xL] = this.toScreen(Math.min(a.from, b.from), 0);
        const [xR] = this.toScreen(Math.max(a.to, b.to), 0);
        ctx.fillRect(xL, y1, xR - xL, y2 - y1);
      }
    }

    // 隣接ペアの表示値: 記載寸法（分割は合計）を優先、無ければ作図距離×縮尺に「≈」を付ける
    _pairText(dir, a, b, mmp) {
      const annot = ZC.dims.spanValue(this.dimsInfo.entries, dir, a.pos, b.pos);
      if (annot) {
        const v = annot.value;
        return U.fmtMm(v, Number.isInteger(v) ? 0 : 1) + (annot.parts.length > 1 ? "*" : "");
      }
      if (!mmp) return "";
      return "≈" + U.fmtMm(Math.abs(b.pos - a.pos) * mmp, 0);
    }

    // 芯々寸法のオーバーレイ（チェック中の芯のみ・値は図面の記載寸法を優先）
    _drawDims(ctx) {
      const mmp = this.mmPerPt();
      const en = this.enabledAxes();
      ctx.font = "11px sans-serif";
      ctx.strokeStyle = COLORS.dim;
      ctx.fillStyle = COLORS.dim;
      ctx.lineWidth = 1;

      // 縦芯（上側に水平の寸法線）
      const vs = en.v.slice().sort((a, b) => a.pos - b.pos);
      if (vs.length >= 2) {
        const topPage = Math.max(...vs.map((a) => a.to));
        const [, yDim] = this.toScreen(0, topPage);
        const y = yDim - 22;
        const [xs] = this.toScreen(vs[0].pos, 0);
        const [xe] = this.toScreen(vs[vs.length - 1].pos, 0);
        ctx.beginPath();
        ctx.moveTo(xs, y);
        ctx.lineTo(xe, y);
        for (const ax of vs) {
          const [sx] = this.toScreen(ax.pos, 0);
          ctx.moveTo(sx, y - 4);
          ctx.lineTo(sx, y + 4);
        }
        ctx.stroke();
        ctx.textAlign = "center";
        for (let i = 0; i + 1 < vs.length; i++) {
          const [x1] = this.toScreen(vs[i].pos, 0);
          const [x2] = this.toScreen(vs[i + 1].pos, 0);
          if (x2 - x1 < 34) continue; // 狭すぎる区間は省略
          const val = this._pairText("v", vs[i], vs[i + 1], mmp);
          if (val) haloText(ctx, val, (x1 + x2) / 2, y - 4);
        }
      }

      // 横芯（左側に垂直の寸法線・文字は90度回転）
      const hs = en.h.slice().sort((a, b) => a.pos - b.pos);
      if (hs.length >= 2) {
        const leftPage = Math.min(...hs.map((a) => a.from));
        const [xDim] = this.toScreen(leftPage, 0);
        const x = xDim - 22;
        const [, ys] = this.toScreen(0, hs[0].pos);
        const [, ye] = this.toScreen(0, hs[hs.length - 1].pos);
        ctx.beginPath();
        ctx.moveTo(x, ys);
        ctx.lineTo(x, ye);
        for (const ax of hs) {
          const [, sy] = this.toScreen(0, ax.pos);
          ctx.moveTo(x - 4, sy);
          ctx.lineTo(x + 4, sy);
        }
        ctx.stroke();
        for (let i = 0; i + 1 < hs.length; i++) {
          const [, y1] = this.toScreen(0, hs[i].pos);
          const [, y2] = this.toScreen(0, hs[i + 1].pos);
          if (y1 - y2 < 34) continue;
          const val = this._pairText("h", hs[i], hs[i + 1], mmp);
          if (!val) continue;
          ctx.save();
          ctx.translate(x - 4, (y1 + y2) / 2);
          ctx.rotate(-Math.PI / 2);
          ctx.textAlign = "center";
          haloText(ctx, val, 0, 0);
          ctx.restore();
        }
      }
    }

    _drawMeasure(ctx) {
      const a = this.measure ? this.measure.a : this.measureTemp;
      const b = this.measure ? this.measure.b : this.measuring ? this._measureCursor : null;
      if (!a) return;
      const pA = this.toScreen(a.x, a.y);
      ctx.fillStyle = COLORS.measure;
      ctx.strokeStyle = COLORS.measure;
      const mark = (p, snapped) => {
        ctx.beginPath();
        if (snapped) ctx.rect(p[0] - 3.5, p[1] - 3.5, 7, 7);
        else ctx.arc(p[0], p[1], 3, 0, Math.PI * 2);
        ctx.fill();
      };
      mark(pA, a.snapped);
      if (!b) return;
      const pB = this.toScreen(b.x, b.y);
      mark(pB, b.snapped);
      ctx.lineWidth = 1.4;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(pA[0], pA[1]);
      ctx.lineTo(pB[0], pB[1]);
      ctx.stroke();
      ctx.setLineDash([]);
      const mmp = this.mmPerPt();
      const f = (val) => U.fmtMm(val * (mmp || 1), 1);
      const unit = mmp ? "mm" : "pt";
      const dx = Math.abs(b.x - a.x);
      const dy = Math.abs(b.y - a.y);
      const len = Math.hypot(dx, dy);
      const label = f(len) + " " + unit + "（ΔX " + f(dx) + " / ΔY " + f(dy) + "）";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "left";
      const mx = (pA[0] + pB[0]) / 2 + 8;
      const my = (pA[1] + pB[1]) / 2 - 8;
      haloText(ctx, label, mx, my);
    }

    // ---- 一覧 ------------------------------------------------------------

    renderList() {
      this.$list.innerHTML = "";
      this._rowMap = new Map();
      const axes = this.allAxes();
      if (!axes.length) return;
      const table = el("table", { class: "axes" });
      const thead = el("thead");
      thead.innerHTML =
        "<tr><th>照合</th><th>方向</th><th>符号</th><th>位置(mm)</th><th>長さ(mm)</th><th>線種</th></tr>";
      table.appendChild(thead);
      const tbody = el("tbody");
      const mmPerPt = this.mmPerPt() || 0;
      const list = this.axes.v.concat(this.axes.h);
      for (const ax of list) {
        const tr = el("tr", {
          class: this.enabled.has(ax) ? "" : "off",
          onmouseenter: () => {
            this.hoverAx = ax;
            this.requestRender();
          },
          onmouseleave: () => {
            this.hoverAx = null;
            this.requestRender();
          },
        });
        const cb = el("input", { type: "checkbox" });
        cb.checked = this.enabled.has(ax);
        cb.addEventListener("change", () => {
          if (cb.checked) this.enabled.add(ax);
          else this.enabled.delete(ax);
          tr.className = cb.checked ? "" : "off";
          this.requestRender();
          ZC.ui.updateRunButton();
        });
        this._rowMap.set(ax, { tr, cb });
        tr.appendChild(el("td", {}, [cb]));
        tr.appendChild(el("td", { text: ax.dir === "v" ? "縦" : "横" }));
        tr.appendChild(el("td", { text: ZC.axis.displayName(ax) + (ax.label == null ? "（符号なし）" : "") }));
        tr.appendChild(el("td", { text: mmPerPt ? U.fmtMm(ax.pos * mmPerPt, 0) : "—" }));
        tr.appendChild(el("td", { text: mmPerPt ? U.fmtMm(ax.extent * mmPerPt, 0) : "—" }));
        tr.appendChild(
          el("td", {
            text: (ax.dashed ? "鎖線/破線" : "実線") + (ax.frameSuspect ? "・図枠?" : ""),
          })
        );
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      this.$list.appendChild(table);
    }
  }

  const ui = {
    base: null,
    cmp: null,
    lastResult: null,

    init() {
      document.querySelectorAll(".ver").forEach((e) => (e.textContent = "v" + ZC.VERSION));
      ui.base = new Panel("base", "基準図面", document.getElementById("panel-base-body"));
      ui.cmp = new Panel("cmp", "比較図面", document.getElementById("panel-cmp-body"));
      document.getElementById("run-check").addEventListener("click", () => ui.runCheck());
      document.getElementById("csv-dl").addEventListener("click", () => ui.downloadCsv());
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          ui.base.cancelMeasure();
          ui.cmp.cancelMeasure();
        }
      });
      globalThis.addEventListener("resize", () => {
        ui.base.requestRender();
        ui.cmp.requestRender();
      });
      ui.updateRunButton();
    },

    updateRunButton() {
      const btn = document.getElementById("run-check");
      if (btn) btn.disabled = !(ui.base && ui.cmp && ui.base.ready() && ui.cmp.ready());
    },

    gatherSide(panel, name) {
      const en = panel.enabledAxes();
      const mmPerPt = panel.mmPerPt();
      return {
        v: en.v,
        h: en.h,
        mmPerPt,
        entries: panel.dimsInfo.entries,
        name,
      };
    },

    runCheck() {
      const tol = Number(document.getElementById("tol").value) || 1;
      const checks = {
        labels: document.getElementById("ck-labels").checked,
        spacing: document.getElementById("ck-spacing").checked,
        total: document.getElementById("ck-total").checked,
        dims: document.getElementById("ck-dims").checked,
      };
      const base = ui.gatherSide(ui.base, "基準");
      const cmp = ui.gatherSide(ui.cmp, "比較");
      const result = ZC.compare.compare(base, cmp, { tol, checks });
      ui.lastResult = result;
      ui.renderResult(result, tol);
    },

    renderResult(result, tol) {
      const wrap = document.getElementById("result");
      wrap.innerHTML = "";
      const s = result.summary;
      const sumCls = s.ng ? "ng" : s.warn ? "warn" : "ok";
      wrap.appendChild(
        el("div", {
          class: "summary " + sumCls,
          text:
            (s.ng ? "NG " + s.ng + "件" : "NGなし") +
            (s.warn ? " / 要確認 " + s.warn + "件" : "") +
            " / OK " + s.ok + "件" +
            "（許容差 ±" + tol + "mm）",
        })
      );
      if (!result.rows.length) {
        wrap.appendChild(el("p", { text: "チェック項目が選択されていないか、対応する芯がありません。" }));
        document.getElementById("csv-dl").hidden = true;
        return;
      }
      wrap.appendChild(
        el("p", { class: "result-hint", text: "行にカーソルを乗せると該当箇所が両方のビュワーで強調表示されます。" })
      );
      const table = el("table", { class: "result" });
      const thead = el("thead");
      thead.innerHTML =
        "<tr><th>判定</th><th>チェック</th><th>方向</th><th>対象</th><th>基準</th><th>比較</th><th>差(mm)</th><th>備考</th></tr>";
      table.appendChild(thead);
      const tbody = el("tbody");
      for (const r of result.rows) {
        const tr = el("tr", { class: r.status.toLowerCase() });
        if (r.refs) {
          tr.addEventListener("mouseenter", () => {
            ui.base.setHighlight(r.refs.b);
            ui.cmp.setHighlight(r.refs.c);
          });
          tr.addEventListener("mouseleave", () => {
            ui.base.setHighlight(null);
            ui.cmp.setHighlight(null);
          });
        }
        tr.appendChild(el("td", { text: r.status === "WARN" ? "要確認" : r.status, class: "st" }));
        tr.appendChild(el("td", { text: r.check }));
        tr.appendChild(el("td", { text: r.dir }));
        tr.appendChild(el("td", { text: r.item }));
        tr.appendChild(el("td", { text: String(r.base) }));
        tr.appendChild(el("td", { text: String(r.cmp) }));
        tr.appendChild(el("td", { text: r.diff == null ? "—" : (r.diff > 0 ? "+" : "") + U.fmtMm(r.diff) }));
        tr.appendChild(el("td", { text: r.note }));
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);
      document.getElementById("csv-dl").hidden = false;
    },

    downloadCsv() {
      if (!ui.lastResult) return;
      const head = ["判定", "チェック", "方向", "対象", "基準", "比較", "差(mm)", "備考"];
      const lines = [head.join(",")];
      for (const r of ui.lastResult.rows) {
        const cells = [
          r.status,
          r.check,
          r.dir,
          r.item,
          String(r.base),
          String(r.cmp),
          r.diff == null ? "" : U.fmtMm(r.diff),
          r.note,
        ].map((c) => '"' + String(c).replace(/"/g, '""') + '"');
        lines.push(cells.join(","));
      }
      // Excel で文字化けしないよう BOM 付き UTF-8
      const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "zumen-check.csv";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
  };

  ZC.ui = ui;
})(globalThis.ZC = globalThis.ZC || {});

/* ===== 31_app.js ===== */
// 起動: ブラウザ上でのみ UI を初期化する（Node のテスト実行では何もしない）
(function (ZC) {
  "use strict";
  if (typeof document === "undefined" || !document.getElementById) return;
  const boot = () => {
    if (document.getElementById("panel-base-body")) ZC.ui.init();
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})(globalThis.ZC = globalThis.ZC || {});

</script>
</body>
